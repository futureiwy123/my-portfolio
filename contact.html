<!DOCTYPE html>
<html lang="vi">

    <meta charset="UTF-8">

<body>

        <a href="index.html" class="logo">PTL<span>.dev</span></a>
        <div class="menu">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html">Liên hệ</a>
        </div>

    <header>
        <h1>Liên hệ với mình</h1>
        <p>Kết nối để trao đổi về học tập và dự án lập trình</p>
    </header>

    <section>
        <h2>Gửi lời nhắn</h2>
        <form id="contactForm" class="project contact-form">
            <input type="text" id="senderName" placeholder="Họ và tên của bạn" required>
            <input type="email" id="senderEmail" placeholder="Email của bạn" required>
            <textarea id="senderMsg" rows="4" placeholder="Nội dung tin nhắn..." required></textarea>
            <button type="submit">Gửi tin nhắn</button>
        </form>
    </section>

    <script src="js/script.js"></script>
</body>
